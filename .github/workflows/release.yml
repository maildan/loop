name: Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.1.0 등 태그 푸시 시 실행

permissions:
  contents: write # GitHub Release 생성 권한

# 📝 필수 GitHub Secrets 설정 (총 30개):
# Repository Settings > Secrets and variables > Actions 에서 다음 secrets 추가:
#
# 🔥 기본 환경
# - NODE_ENV: production
# - STATIC_SERVER_ORIGIN: StaticServer 포트 (35821)
#
# 🔥 URL 설정
# - NEXT_PUBLIC_SHARE_WEB_URL: 공유 웹 URL (https://eloop.kro.kr)
# - NEXT_PUBLIC_SHARE_API_URL: 공유 API URL (https://api.eloop.kro.kr)
#
# 🔥 로깅
# - LOG_LEVEL: 로그 레벨 (debug)
# - DEBUG: 디버그 모드 (true)
# - VERBOSE_LOGGING: 상세 로깅 (true)
#
# 🔥 데이터베이스 (CI용 경로로 설정 필요!)
# - DATABASE_URL: 데이터베이스 URL
# - PRISMA_DATABASE_URL: Prisma 데이터베이스 URL
#
# 🔥 보안
# - ELECTRON_ENABLE_SECURITY_WARNINGS: 보안 경고 (false)
# - ELECTRON_DISABLE_SECURITY_WARNINGS: 보안 경고 비활성화 (true)
#
# 🔥 성능 모니터링
# - ENABLE_PERFORMANCE_TRACKING: 성능 추적 (true)
# - MEMORY_MONITORING: 메모리 모니터링 (true)
#
# 🔥 키보드 모니터링
# - KEYBOARD_MONITORING_ENABLED: 키보드 모니터링 (true)
# - KEYBOARD_DEBUG_MODE: 키보드 디버그 (true)
#
# 🔥 AI 기능
# - AI_ANALYSIS_ENABLED: AI 분석 (true)
# - MOCK_AI_RESPONSES: 모의 AI 응답 (true)
#
# 🔥 개발자 도구 (프로덕션에서는 false 권장)
# - REACT_DEVELOPER_TOOLS: React 개발자 도구 (false)
# - REDUX_DEVTOOLS: Redux 개발자 도구 (false)
#
# 🔥 Google OAuth
# - GOOGLE_CLIENT_ID: Google OAuth 클라이언트 ID
# - GOOGLE_CLIENT_SECRET: Google OAuth 클라이언트 시크릿
# - GOOGLE_API_KEY: Google API 키
# - GOOGLE_REDIRECT_URI: OAuth 리다이렉트 URI
#
# 🔥 암호화
# - ENCRYPT_SNAPSHOT_KEY: 데이터 암호화 키
#
# 🔥 Gemini AI
# - GEMINI_API_KEY: Gemini AI API 키
# - GEMINI_MODEL: AI 모델명 (gemini-2.5-flash-lite)
# - NEXT_PUBLIC_GEMINI_API_KEY: 퍼블릭용 Gemini API 키
# - NEXT_PUBLIC_GEMINI_MODEL: 퍼블릭용 AI 모델명
# - GEMINI_MAX_TOKENS: 최대 토큰 수 (8192)
# - GEMINI_TEMPERATURE: AI 창의성 설정 (0.9)
#
# 🔥 Firebase
# - FIREBASE_API_KEY: Firebase API 키
# - FIRE_AUTH_DOMAIN: Firebase 인증 도메인
# - FIRE_PROJECT_ID: Firebase 프로젝트 ID
# - STORAGE_BUCKET: Firebase Storage 버킷
# - MESSAGING_SENDER_ID: Firebase 메시징 발신자 ID
# - APP_ID: Firebase 앱 ID
# - MEASUREMENT_ID: Firebase 측정 ID
#
# 🔑 설정 방법: https://github.com/maildan/loop/settings/secrets/actions
# ⚠️  DATABASE_URL과 PRISMA_DATABASE_URL은 CI 환경에 맞는 경로로 설정 필요!

jobs:
  release-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Build application
        run: pnpm build
      
      - name: Package Windows application
        run: pnpm dist:win --publish always
        env:
          # GitHub 토큰 (electron-builder가 자동 업로드에 사용)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 🔥 기본 환경 설정
          NODE_ENV: production

          # 🔥 포트 설정 (CI에서는 자동 할당)
          STATIC_SERVER_ORIGIN: ${{ secrets.STATIC_SERVER_ORIGIN }}

          # 🔥 URL 설정 (프로덕션용)
          NEXT_PUBLIC_SHARE_WEB_URL: ${{ secrets.NEXT_PUBLIC_SHARE_WEB_URL }}
          NEXT_PUBLIC_SHARE_API_URL: ${{ secrets.NEXT_PUBLIC_SHARE_API_URL }}

          # 🔥 Logger 설정
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DEBUG: ${{ secrets.DEBUG }}
          VERBOSE_LOGGING: ${{ secrets.VERBOSE_LOGGING }}

          # 🔥 데이터베이스 설정 (CI용 경로로 변경 필요)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}

          # 🔥 보안 설정
          ELECTRON_ENABLE_SECURITY_WARNINGS: ${{ secrets.ELECTRON_ENABLE_SECURITY_WARNINGS }}
          ELECTRON_DISABLE_SECURITY_WARNINGS: ${{ secrets.ELECTRON_DISABLE_SECURITY_WARNINGS }}

          # 🔥 성능 모니터링
          ENABLE_PERFORMANCE_TRACKING: ${{ secrets.ENABLE_PERFORMANCE_TRACKING }}
          MEMORY_MONITORING: ${{ secrets.MEMORY_MONITORING }}

          # 🔥 키보드 모니터링 설정
          KEYBOARD_MONITORING_ENABLED: ${{ secrets.KEYBOARD_MONITORING_ENABLED }}
          KEYBOARD_DEBUG_MODE: ${{ secrets.KEYBOARD_DEBUG_MODE }}

          # 🔥 AI/분석 기능
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          MOCK_AI_RESPONSES: ${{ secrets.MOCK_AI_RESPONSES }}

          # 🔥 개발자 도구 (프로덕션에서는 false)
          REACT_DEVELOPER_TOOLS: ${{ secrets.REACT_DEVELOPER_TOOLS }}
          REDUX_DEVTOOLS: ${{ secrets.REDUX_DEVTOOLS }}

          # 🔥 Google OAuth 설정
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}

          # 🔥 암호화 키
          ENCRYPT_SNAPSHOT_KEY: ${{ secrets.ENCRYPT_SNAPSHOT_KEY }}

          # 🔥 Gemini AI 설정
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_MODEL: ${{ secrets.NEXT_PUBLIC_GEMINI_MODEL }}
          GEMINI_MAX_TOKENS: ${{ secrets.GEMINI_MAX_TOKENS }}
          GEMINI_TEMPERATURE: ${{ secrets.GEMINI_TEMPERATURE }}

          # 🔥 Firebase 설정
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIRE_AUTH_DOMAIN: ${{ secrets.FIRE_AUTH_DOMAIN }}
          FIRE_PROJECT_ID: ${{ secrets.FIRE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.APP_ID }}
          MEASUREMENT_ID: ${{ secrets.MEASUREMENT_ID }}
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Windows
          path: |
            release/*.exe
            release/*.nsis.7z
            release/*.exe.blockmap
            release/latest.yml
          retention-days: 7
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.nsis.7z
            release/*.exe.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
